version: '3.8'

services:
  geosense-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: geosense-ai-server
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=GeoSense AI
      - PORT=8000
      - DEVICE=cpu
      - TORCH_THREADS=8
      - DEMO_MODE=true
      - MAX_LOADED_MODELS=2
      - INFERENCE_TIMEOUT_S=120
      - MAX_UPLOAD_SIZE_MB=50
      - LOG_LEVEL=INFO
      - CORS_ORIGINS=["http://localhost:5173", "http://localhost:3000", "http://localhost:8000", "http://127.0.0.1:5173", "http://127.0.0.1:8000"]
    volumes:
      - ./data/uploads:/app/data/uploads
      - ./data/processed:/app/data/processed
      - ./models:/app/models
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

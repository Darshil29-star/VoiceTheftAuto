# GeoSense AI — central model registry.
#
# The controller and specialists resolve models ONLY through this file.
# To replace a model: add an entry under `models`, then point `tasks.<task>` at it.
# No frontend or API change is required.
#
# Fields
#   name / version        human-readable identity reported in responses and traces
#   backend               loader key (see backend/app/models/loaders/__init__.py)
#   kind                  ml | algorithm
#   repo_id               Hugging Face repo used by scripts/download_models.py
#   local_dir             folder under CHECKPOINT_DIR holding the weights
#   allow_patterns        files to fetch (avoid duplicate .bin + .safetensors downloads)
#   tasks                 which tasks this model can serve
#   input_type            rgb | multispectral | sar | rgb_pair | optical_sar_pair
#   supported_formats     raster formats the specialist accepts for this model
#   provides_scores       true only if the model emits a per-output score we can expose
#   device                auto | cpu | cuda   (auto -> global DEVICE setting)
#   dtype                 float32 on CPU; float16 is used automatically on CUDA when allowed
#   params                model-specific inference knobs
#   enabled               false removes it from routing without deleting config

version: 1

models:
  florence2-bigearthnet:
    name: Florence-2-BigEarthNet-Finetuned
    version: fine-tuned/bigearthnet-v1
    backend: florence2
    kind: ml
    repo_id: BIFOLD-BigEarthNetv2-0/BigEarthNet.txt
    local_dir: florence-2-bigearthnet
    allow_patterns: ["*.json", "*.pt", "*.safetensors", "*.txt"]
    license: CDLA-Permissive-1.0
    size_mb: 69
    tasks: [captioning, vqa, grounding]
    input_type: rgb
    supported_formats: [GTiff, PNG, JPEG]
    provides_scores: false
    device: auto
    dtype: float32
    params:
      caption_task: "<DETAILED_CAPTION>"
      max_new_tokens: 128
      num_beams: 1
    enabled: true

  florence2-base:
    name: Florence-2-base
    version: florence-community/Florence-2-base
    backend: florence2
    kind: ml
    repo_id: florence-community/Florence-2-base
    local_dir: florence-2-base
    allow_patterns: ["*.json", "*.safetensors", "*.txt", "*.model"]
    license: MIT
    size_mb: 463
    tasks: [captioning, grounding]
    input_type: rgb
    supported_formats: [GTiff, PNG, JPEG]
    provides_scores: false        # token log-probs are exposed as an uncalibrated sequence score only
    device: auto
    dtype: float32
    params:
      caption_task: "<DETAILED_CAPTION>"   # shorter than <MORE_DETAILED_CAPTION>; fewer fabricated details (docs/BENCHMARKS.md)
      max_new_tokens: 96
      num_beams: 1                          # greedy: ~9 s on CPU vs ~20 s with 3 beams
    enabled: true

  grounding-dino-tiny:
    name: Grounding DINO (Swin-T)
    version: IDEA-Research/grounding-dino-tiny
    backend: grounding_dino
    kind: ml
    repo_id: IDEA-Research/grounding-dino-tiny
    local_dir: grounding-dino-tiny
    allow_patterns: ["*.json", "model.safetensors", "*.txt"]
    license: Apache-2.0
    size_mb: 689
    tasks: [grounding]
    input_type: rgb
    supported_formats: [GTiff, PNG, JPEG]
    provides_scores: true
    device: auto
    dtype: float32
    params:
      box_threshold: 0.25
      text_threshold: 0.20
      tile_size: 640
      tile_overlap: 96
      tile_when_larger_than: 900
      nms_iou: 0.5
      max_detections: 300
    enabled: true

  segformer-b2-loveda:
    name: SegFormer-B2 (LoveDA land cover)
    version: wu-pr-gw/segformer-b2-finetuned-with-LoveDA
    backend: segformer
    kind: ml
    repo_id: wu-pr-gw/segformer-b2-finetuned-with-LoveDA
    local_dir: segformer-b2-loveda
    allow_patterns: ["*.json", "pytorch_model.bin"]
    license: "unspecified on model card; trained on LoveDA (CC BY-NC-SA 4.0) — non-commercial use"
    size_mb: 110
    tasks: [grounding, captioning_evidence, change_semantics]
    input_type: rgb
    supported_formats: [GTiff, PNG, JPEG]
    provides_scores: true          # per-pixel softmax; region score = mean class probability (uncalibrated)
    device: auto
    dtype: float32
    params:
      tile_size: 512              # model was trained on 512x512 crops
      tile_overlap: 64
      target_gsd_m: 0.3           # LoveDA imagery GSD; inputs are rescaled toward it
      max_rescale: 2.0
      max_working_side: 3072      # caps tiles (latency) for large inputs
      domain_max_gsd_m: 2.0       # coarser imagery is outside the training domain
      # LoveDA label ids -> canonical GeoSense land-cover names
      class_map: {2: building, 3: road, 4: water, 5: barren, 6: forest, 7: agriculture}
      ignore_ids: [0, 1]
      min_region_px: 40
    enabled: true

  slimsam-50:
    name: SlimSAM-50 (uniform)
    version: nielsr/slimsam-50-uniform
    backend: sam
    kind: ml
    repo_id: nielsr/slimsam-50-uniform
    local_dir: slimsam-50-uniform
    allow_patterns: ["*.json", "*.safetensors"]
    license: Apache-2.0
    size_mb: 112
    tasks: [grounding_masks]
    input_type: rgb
    supported_formats: [GTiff, PNG, JPEG]
    provides_scores: true          # predicted mask IoU
    device: auto
    dtype: float32
    params:
      max_boxes: 60
    enabled: true

  smolvlm-256m:
    name: SmolVLM-256M-Instruct
    version: HuggingFaceTB/SmolVLM-256M-Instruct
    backend: smolvlm
    kind: ml
    repo_id: HuggingFaceTB/SmolVLM-256M-Instruct
    local_dir: smolvlm-256m-instruct
    allow_patterns: ["*.json", "model.safetensors", "*.txt", "*.jinja"]
    license: Apache-2.0
    size_mb: 513
    tasks: [vqa]
    input_type: rgb
    supported_formats: [GTiff, PNG, JPEG]
    provides_scores: false
    device: auto
    dtype: float32
    params:
      max_new_tokens: 96
    enabled: true                  # weights not downloaded yet -> DEMO_MODE fallback / model_unavailable

  remoteclip-vit-b32:
    name: RemoteCLIP ViT-B/32
    version: chendelong/RemoteCLIP (RemoteCLIP-ViT-B-32.pt)
    backend: remoteclip
    kind: ml
    repo_id: chendelong/RemoteCLIP
    local_dir: remoteclip
    allow_patterns: ["RemoteCLIP-ViT-B-32.pt"]
    license: Apache-2.0
    size_mb: 605
    tasks: [scene_evidence]
    input_type: rgb
    supported_formats: [GTiff, PNG, JPEG]
    provides_scores: true          # softmax over a supplied label set (relative, uncalibrated)
    device: auto
    dtype: float32
    params:
      arch: ViT-B-32
    enabled: true                  # weights not downloaded yet -> evidence step skipped

  # ---- deterministic / algorithmic components (registered so traces report versions) ----
  change-classical-v1:
    name: Classical bi-temporal change pipeline
    version: "1.0"
    backend: algorithm
    kind: algorithm
    license: project
    tasks: [change_analysis]
    input_type: rgb_pair
    supported_formats: [GTiff, PNG, JPEG]
    provides_scores: false
    params:
      registration: ecc_affine       # ecc_affine | phase | none
      min_region_px: 64
      morph_kernel: 5
    enabled: true

  fusion-rules-v1:
    name: Optical-SAR rule-based fusion
    version: "1.0"
    backend: algorithm
    kind: algorithm
    license: project
    tasks: [optical_sar_fusion]
    input_type: optical_sar_pair
    supported_formats: [GTiff, PNG, JPEG]
    provides_scores: false
    params:
      water_vv_db: -18.0
      builtup_vv_db: -8.0
      ndvi_veg: 0.35
      ndwi_water: 0.0
      lee_window: 5
    enabled: true

  task-classifier-rules-v1:
    name: Pattern task classifier
    version: "1.0"
    backend: algorithm
    kind: algorithm
    license: project
    tasks: [task_classification]
    input_type: text
    supported_formats: []
    provides_scores: false
    enabled: true

  image-stats-v1:
    name: Deterministic image statistics
    version: "1.0"
    backend: algorithm
    kind: algorithm
    license: project
    tasks: [scene_statistics]
    input_type: rgb
    supported_formats: [GTiff, PNG, JPEG]
    provides_scores: false
    enabled: true

# Task routing. The controller asks the registry "who serves <task>?" — never hard-codes names.
tasks:
  captioning:
    primary: florence2-base
    scene_evidence: remoteclip-vit-b32
    statistics: image-stats-v1
  grounding:
    # Concept-aware routing inside the grounding specialist:
    #   land-cover concepts (building, road, water, forest, agriculture, barren) -> landcover
    #   discrete objects (vehicle, ship, storage tank, airplane, ...)            -> primary (open vocabulary)
    primary: grounding-dino-tiny
    landcover: segformer-b2-loveda
    alternates: [florence2-base]
    mask_refiner: slimsam-50
  vqa:
    primary: smolvlm-256m
    evidence_backend: grounding      # presence / count / location questions answered from grounding
  change_analysis:
    primary: change-classical-v1
    semantic_backend: grounding
  optical_sar_fusion:
    primary: fusion-rules-v1
  task_classification:
    primary: task-classifier-rules-v1

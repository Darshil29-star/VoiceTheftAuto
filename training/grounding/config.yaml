# Training configuration for Remote Sensing Visual Grounding
# Portable across CPU (smoke experimentation) and Cloud GPUs (Colab / Kaggle)

model:
  name: "florence-community/Florence-2-base"
  task_prefix: "<CAPTION_TO_PHRASE_GROUNDING>"
  use_lora: true
  lora:
    r: 8
    lora_alpha: 16
    target_modules: ["q_proj", "v_proj"]

data:
  train_manifest: "data/annotations/grounding_train.json"
  val_manifest: "data/annotations/grounding_val.json"
  image_root: "data/samples/grounding"
  target_size: [640, 640]
  classes:
    - building
    - road
    - water
    - vehicle
    - ship
    - airplane
    - storage tank

training:
  device: "auto"
  batch_size: 2
  gradient_accumulation_steps: 4
  epochs: 5
  learning_rate: 2.0e-5
  weight_decay: 0.01
  output_dir: "models/checkpoints/grounding-finetuned"
